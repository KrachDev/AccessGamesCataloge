<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteamPack — AccessGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Cairo:wght@400;600;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #03070c;
      --surface: #0a1120;
      --surface-2: #111d2e;
      --accent: #00d9ff;
      --accent-dim: rgba(0, 217, 255, 0.12);
      --accent-glow: rgba(0, 217, 255, 0.3);
      --gold: #f5c842;
      --text: #f0f4f8;
      --muted: #6b8096;
      --border: rgba(255, 255, 255, 0.07);
      --border-accent: rgba(0, 217, 255, 0.25);
      --radius: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 60, 120, 0.55) 0%, transparent 70%), radial-gradient(ellipse 40% 40% at 85% 80%, rgba(0, 40, 80, 0.3) 0%, transparent 60%), #03070c;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.025;
      background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px) saturate(1.4);
      background: rgba(3, 7, 12, 0.82);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #006fa6);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 217, 255, 0.35);
    }

    .brand-text {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 900;
    }

    .brand-text span {
      color: var(--accent);
    }

    .header-nav {
      display: flex;
      gap: 28px;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: color 0.2s;
      position: relative;
      padding-bottom: 4px;
    }

    .nav-link:hover {
      color: #fff;
    }

    .page-hero {
      text-align: center;
      padding: 60px 0 40px;
    }

    .page-hero h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 40px;
      font-weight: 900;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-hero p {
      color: var(--muted);
      font-size: 17px;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 40px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 16px 24px;
      border-radius: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: #fff;
      font-family: 'Outfit', 'Cairo', sans-serif;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .account-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .account-card:hover {
      border-color: var(--border-accent);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
      transform: translateY(-3px);
    }

    .account-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), transparent);
      opacity: 0.2;
      border-bottom-left-radius: 40px;
    }

    .game-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      font-family: 'Outfit', 'Cairo', sans-serif;
      line-height: 1.4;
    }

    .cred-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      background: var(--surface-2);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .cred-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .cred-val {
      font-family: monospace;
      color: var(--accent);
      font-size: 14px;
      user-select: all;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      text-align: left;
      direction: ltr;
    }

    .extra-info {
      margin-top: 10px;
      font-size: 12px;
      color: var(--gold);
      background: rgba(245, 200, 66, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(245, 200, 66, 0.2);
      line-height: 1.5;
      text-align: left;
      direction: ltr;
    }

    .req-code-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: rgba(0, 217, 255, 0.1);
      color: var(--accent);
      border: 1px solid var(--border-accent);
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: 0.3s;
    }

    .req-code-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .req-code-btn.loading {
      pointer-events: none;
      position: relative;
      color: transparent !important;
    }

    .req-code-btn.loading::after {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 20px;
      height: 20px;
      border: 2.5px solid var(--gold);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .code-result {
      background: var(--surface-2);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      text-align: center;
      margin-top: 10px;
      animation: fadeIn 0.4s ease;
    }

    .code-result .code-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .code-result .code-value {
      color: var(--accent);
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .code-result .code-copy-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .code-result .code-copy-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .code-error {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff4757;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .accounts-grid.list-view {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .accounts-grid.list-view .account-card {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 15px 24px;
    }

    .accounts-grid.list-view .game-title {
      margin-bottom: 0;
      width: 200px;
      flex-shrink: 0;
    }

    .accounts-grid.list-view .cred-row {
      margin-bottom: 0;
      flex: 1;
      min-width: 150px;
      background: transparent;
      border: none;
      padding: 0;
    }

    .accounts-grid.list-view .extra-info {
      width: 100%;
      margin-top: 10px;
    }

    .accounts-grid.list-view .account-card>div[style*="display: flex"] {
      margin-top: 0 !important;
      margin-right: auto;
      flex-wrap: nowrap;
    }

    /* Password Overlay */
    #pwd-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
    }

    .pwd-modal {
      background: var(--surface);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
    }

    .pwd-modal h2 {
      margin-bottom: 20px;
      color: #fff;
      font-family: 'Outfit', 'Cairo', sans-serif;
    }

    .pwd-modal input {
      width: 100%;
      padding: 14px 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #fff;
      font-size: 16px;
      outline: none;
      text-align: center;
    }

    .pwd-modal input:focus {
      border-color: var(--accent);
    }

    .pwd-modal button {
      background: linear-gradient(135deg, var(--accent), #006fa6);
      color: #000;
      border: none;
      padding: 14px 30px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }

    .pwd-modal button:hover {
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .pwd-error {
      color: #ff4d4d;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-2);
      color: #fff;
      padding: 12px 24px;
      border-radius: 100px;
      border: 1px solid var(--border-accent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-size: 14px;
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      opacity: 0;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── CONSTRUCTION DISCLAIMER ── */
    .construction-badge {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1100;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.1);
      backdrop-filter: blur(10px) saturate(1.8);
      -webkit-backdrop-filter: blur(10px) saturate(1.8);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f59e0b;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(245, 158, 11, 0.1);
      pointer-events: none;
      animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .construction-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 10px #f59e0b;
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .price-badge {
      position: fixed;
      top: 55px;
      left: 15px;
      z-index: 1100;
      padding: 6px 14px;
      background: rgba(0, 217, 255, 0.1);
      backdrop-filter: blur(10px) saturate(1.8);
      -webkit-backdrop-filter: blur(10px) saturate(1.8);
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #00d9ff;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 217, 255, 0.1);
      pointer-events: none;
      animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .price-badge svg {
      width: 12px;
      height: 12px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="construction-badge">
    الموقع قيد التطوير
  </div>

  <div class="price-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
      stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="16" x2="12" y2="12" />
      <line x1="12" y1="8" x2="12.01" y2="8" />
    </svg>
    <span>الأسعار قد تختلف — تواصل معنا للتأكد</span>
  </div>

  <!-- Login Overlay -->
  <div id="pwd-overlay">
    <div class="pwd-modal">
      <div class="brand-icon" style="margin: 0 auto 20px; width: 60px; height: 60px; border-radius: 16px;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <h2>تسجيل الدخول</h2>
      <p style="color: var(--muted); margin-bottom: 20px; font-size: 14px;">أدخل بيانات حسابك للوصول إلى SteamPack</p>
      <div class="pwd-error" id="login-error"></div>
      <input type="email" id="email-input" placeholder="البريد الإلكتروني..."
        onkeydown="if(event.key === 'Enter') checkLogin()">
      <input type="password" id="pwd-input" placeholder="كلمة المرور..."
        onkeydown="if(event.key === 'Enter') checkLogin()">
      <button id="login-btn" onclick="checkLogin()">دخول</button>
    </div>
  </div>

  <div class="bg-layer"></div>
  <div class="bg-grid"></div>

  <header>
    <div class="wrap">
      <div class="header-row">
        <a class="brand" href="index.html">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="3" />
              <path d="M8 12h2m1-1v2M17 12h.01M14 12h.01" />
            </svg>
          </div>
          <div class="brand-text">Access<span>Games</span></div>
        </a>
        <nav class="header-nav">
          <a href="index.html" class="nav-link">المتجر</a>
          <a href="steam-pack.html" class="nav-link">SteamPack</a>
        </nav>
      </div>
    </div>
  </header>

  <div class="wrap" style="padding-bottom: 60px;">
    <div class="page-hero">
      <h1>SteamPack</h1>
      <p>قائمة حسابات Steam المتاحة للوصول الفوري في وضع الأوفلاين. انسخ البيانات وسجل الدخول مباشرة.</p>
    </div>

    <div class="search-box" style="display: flex; gap: 10px; max-width: 500px; margin: 0 auto 40px;">
      <input type="text" id="searchInput" placeholder="ابحث عن لعبة..." onkeyup="filterGames()" style="flex: 1;">
      <button id="viewToggle" onclick="toggleView()"
        style="background: var(--surface); border: 1px solid var(--border); border-radius: 100px; width: 56px; color: #fff; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;">
        <svg id="viewIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
    </div>

    <div class="accounts-grid" id="accountsGrid">
    </div>

    <!-- Load PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
      function loadAccounts() {
        Papa.parse('steam_accounts.csv', {
          download: true,
          header: true,
          complete: function (results) {
            const grid = document.getElementById('accountsGrid');
            grid.innerHTML = '';
            results.data.forEach(acc => {
              if (!acc.Title) return;

              const card = document.createElement('div');
              card.className = 'account-card';
              card.setAttribute('data-name', acc.Title.toLowerCase());
              card.style.padding = '0';
              card.style.overflow = 'hidden';
              card.style.display = 'flex';
              card.style.flexDirection = 'column';

              const rawTitle = acc.Title || 'unknown';
              const displayTitle = rawTitle.replace(/---+.*$/, '').trim();
              const safeId = displayTitle.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
              const coverUrl = `assets/covers/${safeId}.webp`;

              let htmlStr = `
                <div class="card-cover" style="height: 200px; position: relative; border-bottom: 1px solid var(--border);">
                   <img src="${coverUrl}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(displayTitle)}&background=random'" style="width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); transition: filter 0.3s;" onmouseover="this.style.filter='brightness(1)'" onmouseout="this.style.filter='brightness(0.7)'" />
                   <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.95)); padding: 30px 15px 15px;">
                      <h3 class="game-title" style="font-size: 18px; margin:0; text-align: left; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">${displayTitle}</h3>
                   </div>
                </div>
                <div class="card-body-content" style="padding: 16px; flex: 1; display: flex; flex-direction: column;">
                   <div class="hidden-data" style="display: none;">
                      <span class="raw-login">${acc.Login || ''}</span>
                      <span class="raw-pass">${acc.Password || ''}</span>
                      <div class="extra-info">${acc.ExtraInfo || ''}</div>
                   </div>

                   <button class="toggle-data-btn req-code-btn" style="width: 100%; margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px;">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                      إظهار بيانات اللعبة
                   </button>
                   
                   <div class="data-panel" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border);">
                      <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                         <button class="copy-login-btn" style="flex: 1; background: rgba(0,217,255,0.1); color: var(--accent); border: 1px solid rgba(0,217,255,0.3); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;">نسخ المستخدم</button>
                         <button class="copy-pass-btn" style="flex: 1; background: rgba(0,217,255,0.1); color: var(--accent); border: 1px solid rgba(0,217,255,0.3); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;">نسخ الباسورد</button>
                      </div>
                      <div class="actions-container"></div>
                   </div>
                </div>
              `;

              card.innerHTML = htmlStr;

              const toggleBtn = card.querySelector('.toggle-data-btn');
              const dataPanel = card.querySelector('.data-panel');
              
              card.querySelector('.copy-login-btn').onclick = () => {
                 copyText(acc.Login || '', 'تم نسخ اسم المستخدم!');
              };
              card.querySelector('.copy-pass-btn').onclick = () => {
                 copyText(acc.Password || '', 'تم نسخ كلمة المرور!');
              };

    <script>

      async function hash(string) {
        const utf8 = new TextEncoder().encode(string);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(bytes => bytes.toString(16).padStart(2, '0')).join('');
      }

      // Telegram Helpers
      async function tgSend(text) {
        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: text })

      // ── FunPay Proxy Config ──
      const FUNPAY_PROXY = 'https://krachdev-funpay-proxy.hf.space';
      const FUNPAY_API_KEY = '4f187f8ae6200352d9dfcb6d18d1ca7f'; // Must match your HF secret

      async function requestCodeFromProxy(login, type = 'steam') {
        const res = await fetch(`${FUNPAY_PROXY}/get-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, type, key: FUNPAY_API_KEY })

      }

      let isBooted = false;
      function bootApp() {
        if (isBooted) return;
        isBooted = true;
        injectCardActions();
      }

      function refreshAllCards() {
        if (!currentUser) return;
        document.querySelectorAll('.account-card').forEach(card => {
          if (card.refreshUI) card.refreshUI();
        });
      }

      function injectCardActions() {
        document.querySelectorAll('.account-card').forEach(card => {
          if (card.dataset.injected) return;
          card.dataset.injected = 'true';

          const gameTitle = card.querySelector('.game-title').innerText;
          const loginVal = card.querySelector('.raw-login').innerText;
          const passVal = card.querySelector('.raw-pass').innerText;
          const extraText = card.querySelector('.extra-info').innerText;
          
          let socialEmail = '';
          const emailMatch = extraText.match(/(?:xbox\s+)?Email\s*[-:]?\s*([^\s]+)/i) || extraText.match(/Social\s*club\s*Email\s*[-:]?\s*([^\s]+)/i);
          if (emailMatch) socialEmail = emailMatch[1].trim();
          
          let socialTypeLabel = 'كود إضافي';
          if (/rockstar|gta|red dead/i.test(gameTitle) || /social\s*club/i.test(extraText)) socialTypeLabel = 'كود Rockstar';
          if (/ubisoft|far cry|assassin|watch dogs|crew/i.test(gameTitle)) socialTypeLabel = 'كود Ubisoft';

            confirmBtn.style.background = 'var(--accent)';
            confirmBtn.style.color = '#000';
            confirmBtn.style.border = 'none';
            confirmBtn.style.padding = '12px 20px';
            confirmBtn.style.borderRadius = '8px';
            confirmBtn.style.cursor = 'pointer';
            confirmBtn.style.fontWeight = 'bold';
            confirmBtn.style.flex = '1';

            const cancelBtn = document.createElement('button');

          function createCodeRequestUI(type, loginToUse, label) {
            const container = document.createElement('div');
            container.style.width = '100%';

            const btn = document.createElement('button');
            btn.className = 'req-code-btn';
            btn.style.background = 'rgba(245, 200, 66, 0.08)';
            btn.style.color = 'var(--gold)';
            btn.style.borderColor = 'rgba(245, 200, 66, 0.25)';
            btn.style.borderWidth = '1px';
            btn.style.borderStyle = 'solid';
            btn.style.marginTop = '0';

            const display = document.createElement('div');
            display.style.display = 'none';
            display.style.marginTop = '10px';

            container.appendChild(btn);
            container.appendChild(display);

            const refresh = () => {
              if (!currentUser || !loginToUse) {
                btn.style.display = 'none';
                return false;
              }
              const waitingKey = `req_${type}_${currentUser.email}_${loginToUse}`;
              const cdKey = `cd_${type}_${currentUser.email}`;
              const state = JSON.parse(localStorage.getItem(waitingKey) || 'null');

              let isReceived = false;

              if (state) {
                if (Date.now() - state.reqTime > 30 * 60 * 1000) {
                  localStorage.removeItem(waitingKey);
                  btn.innerText = `طلب ${label}`;
                  btn.disabled = false;
                  btn.style.opacity = '1';
                  display.style.display = 'none';
                } else if (state.status === 'waiting') {
                  const mins = Math.floor((Date.now() - state.reqTime) / 60000);
                  btn.innerText = `⏳ جاري الانتظار... (${mins} د)`;
                  btn.disabled = true;
                  btn.style.opacity = '0.7';
                  display.style.display = 'none';
                } else if (state.status === 'received') {
                  isReceived = true;
                  btn.innerText = `تم استلام ${label} ✔️`;
                  btn.disabled = true;
                  btn.style.opacity = '0.5';
                  display.style.display = 'block';
                  display.innerHTML = `
                    <div class="code-result">
                      <div class="code-label">الكود المستلم — ${state.identifier || loginToUse}</div>
                      <div class="code-value">${state.code}</div>
                      <button class="code-copy-btn" onclick="copyText('${state.code}', 'تم نسخ الكود!'); this.style.background='var(--accent)'; this.style.color='#000'">نسخ الكود</button>
                    </div>
                  `;
                }
              } else {
                const lastCd = parseInt(localStorage.getItem(cdKey) || '0');
                if (Date.now() - lastCd < 2 * 60 * 1000) {
                  const sec = Math.ceil((2 * 60 * 1000 - (Date.now() - lastCd)) / 1000);
                  btn.innerText = `انتظر ${sec} ثانية...`;
                  btn.disabled = true;
                  btn.style.opacity = '0.5';
                } else {
                  btn.innerText = `طلب ${label}`;
                  btn.disabled = false;
                  btn.style.opacity = '1';
                }
                display.style.display = 'none';
              }
              return isReceived;
            };

            btn.onclick = async () => {
              if (!currentUser || !loginToUse) return;
              const waitingKey = `req_${type}_${currentUser.email}_${loginToUse}`;
              const cdKey = `cd_${type}_${currentUser.email}`;
              
              const lastCd = parseInt(localStorage.getItem(cdKey) || '0');
              if (Date.now() - lastCd < 2 * 60 * 1000) return;

              showConfirmDialog(
                'تنبيه هام جداً ⚠️',
                'يجب عليك طلب الكود فقط إذا كانت شاشة إدخال الكود ظاهرة أمامك بالفعل في اللعبة أو المنصة.\n\nهل شاشة الكود مفتوحة أمامك الآن؟',
                async () => {
                  localStorage.setItem(cdKey, Date.now().toString());

                  btn.classList.add('loading');
                  btn.innerText = 'جارٍ جلب الكود...';
                  btn.disabled = true;
                  display.style.display = 'none';

                  tgSend(`🤖 طلب كود تلقائي\n━━━━━━━━━━━━━━━━━━\n👤 User: ${currentUser.email}\n📋 Game: ${gameTitle}\n👤 Login: ${loginToUse}\n🔑 Type: ${type}\n⏰ Time: ${new Date().toLocaleString('en-US')}`);

                    const result = await requestCodeFromProxy(loginToUse, type);
                    if (result.ok) {
                      localStorage.setItem(waitingKey, JSON.stringify({
                        status: 'received',
                        reqTime: Date.now(),
                        code: result.code,
                        identifier: result.identifier

                      card.refreshUI();
                      tgSend(`✅ كود تلقائي تم استلامه\n📋 ${gameTitle}\n👤 ${loginToUse}\n🔑 ${result.code}`);
                    } else {
                      btn.classList.remove('loading');
                      btn.innerText = `طلب ${label}`;
                      btn.disabled = false;
                      btn.style.opacity = '1';
                      display.style.display = 'block';
                      display.innerHTML = `<div class="code-error">❌ فشل جلب الكود: ${result.error || 'خطأ غير معروف'}</div>`;
                      setTimeout(() => { display.style.display = 'none'; }, 8000);
                    }
                  } catch (err) {
                    btn.classList.remove('loading');
                    btn.innerText = `طلب ${label}`;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    display.style.display = 'block';
                    display.innerHTML = `<div class="code-error">❌ خطأ في الاتصال بالسيرفر</div>`;
                    setTimeout(() => { display.style.display = 'none'; }, 8000);
                  }
                }
              );
            };

            return { container, refresh };
          }

          const steamUI = createCodeRequestUI('steam', loginVal, 'كود Steam');
          actionContainer.appendChild(steamUI.container);

          let socialUI = null;
          if (hasSocial && socialEmail) {
            socialUI = createCodeRequestUI('social', socialEmail, socialTypeLabel);
            actionContainer.appendChild(socialUI.container);
          }

          card.refreshUI = () => {
            const steamReceived = steamUI ? steamUI.refresh() : false;
            if (socialUI) {
               socialUI.refresh();
               // Hide social UI until Steam is received
               if(!steamReceived) {
                  socialUI.container.style.display = 'none';
               } else {
                  socialUI.container.style.display = 'block';
               }
            }
          };

          card.refreshUI();
        });
      }

      function filterGames() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.account-card');

        cards.forEach(card => {

      let toastTimeout;
      function copyText(text, message = 'تم النسخ بنجاح!') {
        navigator.clipboard.writeText(text).then(() => {
          const toast = document.getElementById('toast');
          toast.innerText = message;
          toast.classList.add('show');
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
          }, 2000);
        });
      }

    </script>
