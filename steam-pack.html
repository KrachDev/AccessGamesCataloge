<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteamPack — AccessGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Cairo:wght@400;600;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #03070c;
      --surface: #0a1120;
      --surface-2: #111d2e;
      --accent: #00d9ff;
      --accent-dim: rgba(0, 217, 255, 0.12);
      --accent-glow: rgba(0, 217, 255, 0.3);
      --gold: #f5c842;
      --text: #f0f4f8;
      --muted: #6b8096;
      --border: rgba(255, 255, 255, 0.07);
      --border-accent: rgba(0, 217, 255, 0.25);
      --radius: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 60, 120, 0.55) 0%, transparent 70%), radial-gradient(ellipse 40% 40% at 85% 80%, rgba(0, 40, 80, 0.3) 0%, transparent 60%), #03070c;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.025;
      background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px) saturate(1.4);
      background: rgba(3, 7, 12, 0.82);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #006fa6);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 217, 255, 0.35);
    }

    .brand-text {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 900;
    }

    .brand-text span {
      color: var(--accent);
    }

    .header-nav {
      display: flex;
      gap: 28px;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: color 0.2s;
      position: relative;
      padding-bottom: 4px;
    }

    .nav-link:hover {
      color: #fff;
    }

    .page-hero {
      text-align: center;
      padding: 60px 0 40px;
    }

    .page-hero h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 40px;
      font-weight: 900;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-hero p {
      color: var(--muted);
      font-size: 17px;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 40px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 16px 24px;
      border-radius: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: #fff;
      font-family: 'Outfit', 'Cairo', sans-serif;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .account-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .account-card:hover {
      border-color: var(--border-accent);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
      transform: translateY(-3px);
    }

    .account-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), transparent);
      opacity: 0.2;
      border-bottom-left-radius: 40px;
    }

    .game-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      font-family: 'Outfit', 'Cairo', sans-serif;
      line-height: 1.4;
    }

    .cred-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      background: var(--surface-2);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .cred-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .cred-val {
      font-family: monospace;
      color: var(--accent);
      font-size: 14px;
      user-select: all;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      text-align: left;
      direction: ltr;
    }

    .extra-info {
      margin-top: 10px;
      font-size: 12px;
      color: var(--gold);
      background: rgba(245, 200, 66, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(245, 200, 66, 0.2);
      line-height: 1.5;
      text-align: left;
      direction: ltr;
    }

    .req-code-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: rgba(0, 217, 255, 0.1);
      color: var(--accent);
      border: 1px solid var(--border-accent);
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: 0.3s;
    }

    .req-code-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .req-code-btn.loading {
      pointer-events: none;
      position: relative;
      color: transparent !important;
    }

    .req-code-btn.loading::after {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 20px;
      height: 20px;
      border: 2.5px solid var(--gold);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .code-result {
      background: var(--surface-2);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      text-align: center;
      margin-top: 10px;
      animation: fadeIn 0.4s ease;
    }

    .code-result .code-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .code-result .code-value {
      color: var(--accent);
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .code-result .code-copy-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .code-result .code-copy-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .code-error {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff4757;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .accounts-grid.list-view {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .accounts-grid.list-view .account-card {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 15px 24px;
    }

    .accounts-grid.list-view .game-title {
      margin-bottom: 0;
      width: 200px;
      flex-shrink: 0;
    }

    .accounts-grid.list-view .cred-row {
      margin-bottom: 0;
      flex: 1;
      min-width: 150px;
      background: transparent;
      border: none;
      padding: 0;
    }

    .accounts-grid.list-view .extra-info {
      width: 100%;
      margin-top: 10px;
    }

    .accounts-grid.list-view .account-card>div[style*="display: flex"] {
      margin-top: 0 !important;
      margin-right: auto;
      flex-wrap: nowrap;
    }

    /* Password Overlay */
    #pwd-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
    }

    .pwd-modal {
      background: var(--surface);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
    }

    .pwd-modal h2 {
      margin-bottom: 20px;
      color: #fff;
      font-family: 'Outfit', 'Cairo', sans-serif;
    }

    .pwd-modal input {
      width: 100%;
      padding: 14px 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #fff;
      font-size: 16px;
      outline: none;
      text-align: center;
    }

    .pwd-modal input:focus {
      border-color: var(--accent);
    }

    .pwd-modal button {
      background: linear-gradient(135deg, var(--accent), #006fa6);
      color: #000;
      border: none;
      padding: 14px 30px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }

    .pwd-modal button:hover {
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .pwd-error {
      color: #ff4d4d;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-2);
      color: #fff;
      padding: 12px 24px;
      border-radius: 100px;
      border: 1px solid var(--border-accent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-size: 14px;
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      opacity: 0;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── CONSTRUCTION DISCLAIMER ── */
    .construction-badge {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1100;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.1);
      backdrop-filter: blur(10px) saturate(1.8);
      -webkit-backdrop-filter: blur(10px) saturate(1.8);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f59e0b;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(245, 158, 11, 0.1);
      pointer-events: none;
      animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .construction-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 10px #f59e0b;
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .price-badge {
      position: fixed;
      top: 55px;
      left: 15px;
      z-index: 1100;
      padding: 6px 14px;
      background: rgba(0, 217, 255, 0.1);
      backdrop-filter: blur(10px) saturate(1.8);
      -webkit-backdrop-filter: blur(10px) saturate(1.8);
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #00d9ff;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 217, 255, 0.1);
      pointer-events: none;
      animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .price-badge svg {
      width: 12px;
      height: 12px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Load PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
      function loadAccounts() {
        Papa.parse('steam_accounts.csv', {
          download: true,
          header: true,
          complete: function (results) {
            const grid = document.getElementById('accountsGrid');
            grid.innerHTML = '';
            results.data.forEach(acc => {
              if (!acc.Title) return;

              const card = document.createElement('div');
              card.className = 'account-card';
              card.setAttribute('data-name', acc.Title.toLowerCase());

              let htmlStr = `<div class="game-title">${acc.Title}</div>`;

              if (acc.Login) {
                htmlStr += `<div class="cred-row">
                  <span class="cred-label">Login</span>
                  <span class="cred-val" onclick="copyText('${acc.Login}')" title="${acc.Login}">${acc.Login}</span>
                </div>`;
              }

              if (acc.Password) {
                // In the original, passwords were raw or masked based on script execution, 
                // but the original HTML had them as clear text in the value.
                // We will populate them as clear text here, and let the existing script mask them if it does.
                htmlStr += `<div class="cred-row">
                  <span class="cred-label">Password</span>
                  <span class="cred-val" onclick="copyText('${acc.Password}')" title="${acc.Password}">${acc.Password}</span>
                </div>`;
              }

              if (acc.ExtraInfo) {
                htmlStr += `<div class="extra-info">${acc.ExtraInfo}</div>`;
              }

              card.innerHTML = htmlStr;
              grid.appendChild(card);
            });
            // Re-run initAuth to apply the password masking and request buttons
            if (typeof initAuth === 'function') {
              // Wait a bit to ensure DOM is updated
              setTimeout(initAuth, 100);
            }
          }
        });
      }

      document.addEventListener('DOMContentLoaded', loadAccounts);
    </script>

    <script>

      async function hash(string) {
        const utf8 = new TextEncoder().encode(string);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(bytes => bytes.toString(16).padStart(2, '0')).join('');
      }

      const BOT_TOKEN = '8668820100:AAFdGX03IKjB6GWVh-BuOANO7OYPQ3HV68A';
      const CHAT_ID = '8691592034';

      const SUPABASE_URL = 'https://nwyuyxailqogjfzspxex.supabase.co'; // <--- PASTE SUPABASE URL HERE

      async function checkLogin() {
        const email = document.getElementById('email-input').value.trim().toLowerCase();
        const pwd = document.getElementById('pwd-input').value;
        const errEl = document.getElementById('login-error');

        if (!email || !pwd) {
          errEl.innerText = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
          errEl.style.display = 'block';
          return;
        }

        document.getElementById('login-btn').innerText = 'جاري التحقق...';
        document.getElementById('login-btn').disabled = true;

        try {
          // ==========================================
          // 1) SUPABASE AUTH FLOW (Production)
          // ==========================================
          if (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && window.supabase) {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data, error } = await supabase.auth.signInWithPassword({ email, password: pwd });

            if (error) {
              errEl.innerText = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';

            currentUser = { email: data.user.email, name: data.user.email }; // Supabase users
            sessionStorage.setItem('sp_user', JSON.stringify(currentUser));
          }
          // ==========================================
          // 2) USERS.JSON FALLBACK FLOW (Prototype)
          // ==========================================
          else {
            const res = await fetch('data/users.json');
            const data = await res.json();
            const pwdHash = await hash(pwd);

            const user = data.users.find(u => u.email === email && u.passwordHash === pwdHash);

            if (user) {
              currentUser = user;
              sessionStorage.setItem('sp_user', JSON.stringify(user));
            } else {
              errEl.innerText = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
              errEl.style.display = 'block';
              return;
            }
          }

          // Successful login
          document.getElementById('pwd-overlay').style.display = 'none';
          errEl.style.display = 'none';

          fetch('https://api.ipify.org?format=json').then(r => r.json()).then(ipData => {
            tgSend(`🔓 تسجيل دخول ناجح\n👤 ${currentUser.name} (${currentUser.email})\n🌐 IP: ${ipData.ip}\n⏰ ${new Date().toLocaleString('ar-EG')}`);
          }).catch(() => { });

          bootApp();

        } catch (e) {
          console.error(e);
          errEl.innerText = 'حدث خطأ في الاتصال بقاعدة البيانات';
          errEl.style.display = 'block';
        } finally {
          document.getElementById('login-btn').innerText = 'دخول';
          document.getElementById('login-btn').disabled = false;
        }
      }

      function initAuth() {
        const stored = sessionStorage.getItem('sp_user');
        if (stored) {
          currentUser = JSON.parse(stored);
          document.getElementById('pwd-overlay').style.display = 'none';
          bootApp();
        }
      }

      // Telegram Helpers
      async function tgSend(text) {
        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: text })
          });
        } catch (e) { console.error('TG Send error', e); }
      }

      // ── FunPay Proxy Config ──
      const FUNPAY_PROXY = 'https://krachdev-funpay-proxy.hf.space';
      const FUNPAY_API_KEY = '4f187f8ae6200352d9dfcb6d18d1ca7f'; // Must match your HF secret

      async function requestCodeFromProxy(login, type = 'steam') {
        const res = await fetch(`${FUNPAY_PROXY}/get-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, type, key: FUNPAY_API_KEY })
        });
        return await res.json();
      }

      let isBooted = false;
      function bootApp() {
        if (isBooted) return;
        isBooted = true;
        injectCardActions();
      }

      function refreshAllCards() {
        if (!currentUser) return;
        document.querySelectorAll('.account-card').forEach(card => {
          if (card.refreshUI) card.refreshUI();
        });
      }

      function injectCardActions() {
        document.querySelectorAll('.account-card').forEach(card => {
          const gameTitle = card.querySelector('.game-title').innerText;

          // Extract Email/Password from extra-info if present
          const extra = card.querySelector('.extra-info');
          if (extra) {
            const extraText = extra.innerText;
            const match = extraText.match(/(?:xbox\s+)?Email\s*[-:]?\s*([^\s]+)\s+Password\s*[-:]?\s*([^\s]+)/i);
            if (match) {
              const extEmail = match[1];
              const extPass = match[2];

              const emailRow = document.createElement('div');
              emailRow.className = 'cred-row';
              emailRow.innerHTML = `<span class="cred-label">Xbox Email</span><span class="cred-val">${extEmail}</span>`;
              extra.parentNode.insertBefore(emailRow, extra);

              const passRow = document.createElement('div');
              passRow.className = 'cred-row';
              passRow.innerHTML = `<span class="cred-label">Xbox Password</span><span class="cred-val" title="${extPass}">${extPass}</span>`;
              extra.parentNode.insertBefore(passRow, extra);

              let remainder = extraText.replace(match[0], '').trim();
              if (remainder.toLowerCase().replace('xbox', '').trim() === '') {
                extra.remove();
              } else {
                extra.innerText = remainder;
              }
            }
          }

          let copyStr = `اللعبة: ${gameTitle}\n`;
          card.querySelectorAll('.cred-row').forEach(row => {
            const label = row.querySelector('.cred-label').innerText;
            const valEl = row.querySelector('.cred-val');
            let val = valEl.innerText;

            // Check if this row is a password (including Email Password)
            const isPassword = label.toLowerCase().includes('password') || label.includes('كلمة المرور');
            if (isPassword) {
              // Get the real value from title if it exists, or use innerText
              val = valEl.getAttribute('title') || val;
              valEl.innerText = '••••••••••••';
              valEl.removeAttribute('title'); // Prevent hover exposing it
            } else {
              // Only add NON-password fields to the full "Copy Account" string
              copyStr += `${label}: ${val}\n`;
            }

            if (!row.querySelector('.inline-copy-icon')) {
              const copyContainer = document.createElement('div');
              copyContainer.style.display = 'flex';
              copyContainer.style.alignItems = 'center';
              copyContainer.style.gap = '8px';

              valEl.parentNode.insertBefore(copyContainer, valEl);
              copyContainer.appendChild(valEl);

              const copyIcon = document.createElement('div');
              copyIcon.className = 'inline-copy-icon';
              copyIcon.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
              copyIcon.style.cssText = 'cursor:pointer; color:var(--muted); display:flex; align-items:center; transition:0.2s';
              copyIcon.title = 'نسخ';
              copyIcon.onmouseover = () => copyIcon.style.color = 'var(--accent)';
              copyIcon.onmouseout = () => copyIcon.style.color = 'var(--muted)';
              copyIcon.onclick = (e) => {
                e.stopPropagation();
                copyText(val, 'تم النسخ بنجاح!');

                // For security, clear the clipboard 15 seconds after copying a password
                if (isPassword) {
                  setTimeout(() => {
                    navigator.clipboard.writeText(' ').catch(() => { });
                  }, 15000);
                }
              };
              copyContainer.appendChild(copyIcon);
            }
          });

          const extraAfter = card.querySelector('.extra-info');
          if (extraAfter) {
            copyStr += `تفاصيل إضافية: ${extraAfter.innerText}\n`;
          }

          const loginEl = Array.from(card.querySelectorAll('.cred-row')).find(r => r.querySelector('.cred-label').innerText.includes('Login'));
          const loginVal = loginEl ? loginEl.querySelector('.cred-val').innerText : '';

          const actionContainer = document.createElement('div');
          actionContainer.style.marginTop = '12px';

          const reqBtn = document.createElement('button');
          reqBtn.className = 'req-code-btn';
          reqBtn.style.background = 'rgba(245, 200, 66, 0.08)';
          reqBtn.style.color = 'var(--gold)';
          reqBtn.style.borderColor = 'rgba(245, 200, 66, 0.25)';
          reqBtn.style.borderWidth = '1px';
          reqBtn.style.borderStyle = 'solid';

          const codeDisplay = document.createElement('div');
          codeDisplay.style.display = 'none';
          codeDisplay.style.marginTop = '10px';

          card.refreshUI = () => {
            if (!currentUser || !loginVal) return;
            const waitingKey = `req_${currentUser.email}_${loginVal}`;
            const state = JSON.parse(localStorage.getItem(waitingKey) || 'null');

            if (state) {
              if (Date.now() - state.reqTime > 30 * 60 * 1000) {
                localStorage.removeItem(waitingKey);
                reqBtn.innerText = 'طلب كود جديد';
                reqBtn.disabled = false;
                reqBtn.style.opacity = '1';
                codeDisplay.style.display = 'none';
              } else if (state.status === 'waiting') {
                const mins = Math.floor((Date.now() - state.reqTime) / 60000);
                reqBtn.innerText = `⏳ جاري الانتظار... (${mins} د)`;
                reqBtn.disabled = true;
                reqBtn.style.opacity = '0.7';
                codeDisplay.style.display = 'none';
              } else if (state.status === 'received') {
                reqBtn.innerText = 'تم استلام الكود ✔️';
                reqBtn.disabled = true;
                reqBtn.style.opacity = '0.5';

                codeDisplay.style.display = 'block';
                codeDisplay.innerHTML = `
                <div style="background:var(--surface-2);padding:14px;border-radius:8px;border:1px solid var(--accent);text-align:center">
                  <div style="font-size:11px;color:var(--muted);margin-bottom:6px">الكود المستلم</div>
                  <div style="color:var(--accent);font-family:monospace;font-size:22px;font-weight:bold;letter-spacing:3px;margin-bottom:10px">${state.code}</div>
                  <button onclick="copyText('${state.code}', 'تم نسخ الكود!'); this.style.background='var(--accent)'; this.style.color='#000'" style="background:transparent;border:1px solid var(--accent);color:var(--accent);padding:6px 16px;border-radius:100px;font-size:12px;cursor:pointer;transition:0.2s">نسخ الكود</button>
                </div>
              `;
              }
            } else {
              const cdKey = `cd_${currentUser.email}`;
              const lastCd = parseInt(localStorage.getItem(cdKey) || '0');
              if (Date.now() - lastCd < 2 * 60 * 1000) {
                const sec = Math.ceil((2 * 60 * 1000 - (Date.now() - lastCd)) / 1000);
                reqBtn.innerText = `انتظر ${sec} ثانية...`;
                reqBtn.disabled = true;
                reqBtn.style.opacity = '0.5';
              } else {
                reqBtn.innerText = 'طلب الكود من الإدارة';
                reqBtn.disabled = false;
                reqBtn.style.opacity = '1';
              }
              codeDisplay.style.display = 'none';
            }
          };

          reqBtn.onclick = async () => {
            if (!currentUser || !loginVal) return;

            const cdKey = `cd_${currentUser.email}`;
            const lastCd = parseInt(localStorage.getItem(cdKey) || '0');
            if (Date.now() - lastCd < 2 * 60 * 1000) return;

            // Determine if this account needs a social code (check for Social club info)
            const extraEl = card.querySelector('.extra-info');
            const extraText = extraEl ? extraEl.innerText : '';
            const hasSocial = /social\s*club/i.test(extraText);

            // For social accounts, extract the email from extra info
            let codeLogin = loginVal;
            let codeType = 'steam';
            if (hasSocial) {
              const emailMatch = extraText.match(/Social\s*club\s*Email\s*[-:]?\s*([^\s]+)/i);
              if (emailMatch) {
                codeLogin = emailMatch[1].trim();
                codeType = 'social';
              }
            }

            // Set cooldown
            localStorage.setItem(cdKey, Date.now().toString());

            // Show loading state
            reqBtn.classList.add('loading');
            reqBtn.innerText = 'جارٍ جلب الكود...';
            reqBtn.disabled = true;
            codeDisplay.style.display = 'none';

            // Send notification to Telegram (fire-and-forget)
            tgSend(`🤖 طلب كود تلقائي\n━━━━━━━━━━━━━━━━━━\n👤 User: ${currentUser.email}\n📋 Game: ${gameTitle}\n👤 Login: ${codeLogin}\n🔑 Type: ${codeType}\n⏰ Time: ${new Date().toLocaleString('en-US')}`);

            try {
              const result = await requestCodeFromProxy(codeLogin, codeType);

              if (result.ok) {
                // Save the code
                const waitingKey = `req_${currentUser.email}_${loginVal}`;
                localStorage.setItem(waitingKey, JSON.stringify({
                  status: 'received',
                  reqTime: Date.now(),
                  code: result.code
                }));

                // Show the code
                reqBtn.classList.remove('loading');
                reqBtn.innerText = 'تم استلام الكود ✔️';
                reqBtn.disabled = true;
                reqBtn.style.opacity = '0.5';

                codeDisplay.style.display = 'block';
                codeDisplay.innerHTML = `
                <div class="code-result">
                  <div class="code-label">الكود المستلم — ${result.identifier || codeLogin}</div>
                  <div class="code-value">${result.code}</div>
                  <button class="code-copy-btn" onclick="copyText('${result.code}', 'تم نسخ الكود!'); this.style.background='var(--accent)'; this.style.color='#000'">نسخ الكود</button>
                </div>
              `;

                // Notify via Telegram that code was received
                tgSend(`✅ كود تلقائي تم استلامه\n📋 ${gameTitle}\n👤 ${codeLogin}\n🔑 ${result.code}`);
              } else {
                // Show error
                reqBtn.classList.remove('loading');
                reqBtn.innerText = 'طلب الكود من الإدارة';
                reqBtn.disabled = false;
                reqBtn.style.opacity = '1';

                codeDisplay.style.display = 'block';
                codeDisplay.innerHTML = `
                <div class="code-error">
                  ❌ فشل جلب الكود: ${result.error || 'خطأ غير معروف'}
                </div>
              `;
                setTimeout(() => { codeDisplay.style.display = 'none'; }, 8000);
              }
            } catch (err) {
              reqBtn.classList.remove('loading');
              reqBtn.innerText = 'طلب الكود من الإدارة';
              reqBtn.disabled = false;
              reqBtn.style.opacity = '1';

              codeDisplay.style.display = 'block';
              codeDisplay.innerHTML = `
              <div class="code-error">
                ❌ خطأ في الاتصال بالسيرفر — تأكد أن البروكسي شغال
              </div>
            `;
              setTimeout(() => { codeDisplay.style.display = 'none'; }, 8000);
            }
          };

          actionContainer.appendChild(reqBtn);
          actionContainer.appendChild(codeDisplay);

          const actionsDiv = document.createElement('div');
          actionsDiv.style.display = 'flex';
          actionsDiv.style.gap = '10px';
          actionsDiv.style.marginTop = '12px';

          const copyBtn = document.createElement('div');
          copyBtn.className = 'req-code-btn';
          copyBtn.style.marginTop = '0';
          copyBtn.innerText = 'نسخ الحساب';
          copyBtn.onclick = () => copyText(copyStr.trim(), 'تم نسخ الحساب بالكامل!');

          actionsDiv.appendChild(copyBtn);

          card.appendChild(actionsDiv);
          card.appendChild(actionContainer);

          card.refreshUI();
        });
      }

      function filterGames() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.account-card');

        cards.forEach(card => {
          const name = card.getAttribute('data-name');
          if (name.includes(input)) {
            card.style.display = '';
          } else {
            card.style.display = 'none';
          }
        });
      }

      function toggleView() {
        const grid = document.getElementById('accountsGrid');
        const icon = document.getElementById('viewIcon');
        if (grid.classList.contains('list-view')) {
          grid.classList.remove('list-view');
          icon.innerHTML = '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>';
        } else {
          grid.classList.add('list-view');
          icon.innerHTML = '<line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>';
        }
      }

      let toastTimeout;
      function copyText(text, message = 'تم النسخ بنجاح!') {
        navigator.clipboard.writeText(text).then(() => {
          const toast = document.getElementById('toast');
          toast.innerText = message;
          toast.classList.add('show');
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
          }, 2000);
        });
      }

      // document.addEventListener("DOMContentLoaded", initAuth);
    </script>
    <div id="toast" class="toast"></div>
    <script defer src="scripts/analytics.js"></script>
</body>

</html>
